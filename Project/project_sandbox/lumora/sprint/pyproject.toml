[project]
name = "lumora-sprint"
version = "0.1.0"
description = "Lumora Phase-1 sprint loop: batch spec -> generate -> packet -> (manual publish) -> log -> metrics -> review"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "anthropic>=0.60",
  "replicate>=1.0",
  "pillow>=10.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lumora = "lumora_sprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumora_sprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
